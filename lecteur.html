<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetProtect</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { position: relative; width: 100%; height: 100%; display: flex;
           align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; cursor: pointer;
    background: rgba(0,0,0,.35);
  }
  .overlay.hidden { display: none; }
  .play {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.55);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
  }
  .play svg { width: 34px; height: 34px; fill: #fff; margin-left: 5px; }
  .label { color: #e8ebf2; font: 600 15px "Segoe UI", Arial, sans-serif; letter-spacing: .3px; }
  .msg { position: absolute; inset: auto 12px 16px 12px; color: #d8dde9; text-align: center;
         font: 13px "Segoe UI", Arial, sans-serif; display: none; }
  .msg a { color: #8ab4ff; }
  .title { position: absolute; top: 10px; left: 0; right: 0; text-align: center;
           color: #aeb6c6; font: 500 13px "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<div class="stage">
  <video controls playsinline preload="metadata" poster="https://cdn.jsdelivr.net/gh/lompojerome80-hue/netprotect-demo@main/affiche.jpg" id="v"
         src="https://cdn.jsdelivr.net/gh/lompojerome80-hue/netprotect-demo@main/video-demo-netprotect.mp4"></video>

  <div class="title">NetProtect — démonstration</div>

  <div class="overlay" id="ov">
    <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="label">Cliquer pour lire la vidéo</div>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
  var v = document.getElementById('v'), ov = document.getElementById('ov'), msg = document.getElementById('msg');
  function show(t) { msg.style.display = 'block'; msg.innerHTML = t; }
  function start() {
    ov.classList.add('hidden');
    var p = v.play();
    if (p && p.catch) p.catch(function () {
      show('Lecture impossible ici. <a href="https://cdn.jsdelivr.net/gh/lompojerome80-hue/netprotect-demo@main/video-demo-netprotect.mp4" target="_blank">Ouvrir la vidéo</a>');
    });
  }
  ov.addEventListener('click', start);
  v.addEventListener('error', function () {
    show('Vidéo non chargée. <a href="https://cdn.jsdelivr.net/gh/lompojerome80-hue/netprotect-demo@main/video-demo-netprotect.mp4" target="_blank">Ouvrir la vidéo</a>');
  });
</script>
</body>
</html>
