<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetProtect — Lecteur</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { position: relative; width: 100%; height: 100%; display: flex;
           align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .fallback { position: absolute; inset: auto 0 40% 0; text-align: center; color: #ccc;
              font: 14px "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<div class="stage">
  <video controls playsinline autoplay muted preload="auto"
         poster="" id="v">
    <source src="video-demo-netprotect.mp4" type="video/mp4">
  </video>
  <div class="fallback">Si la lecture ne démarre pas,
    <a href="video-demo-netprotect.mp4" style="color:#8ab4ff">cliquez ici</a>.</div>
</div>
<script>
  // autoplay avec son si le navigateur l'autorise déjà, sinon le visiteur active le son via les commandes
  var v = document.getElementById('v');
  v.muted = false;
  var p = v.play();
  if (p && p.catch) p.catch(function () { v.muted = true; v.play(); });
</script>
</body>
</html>
