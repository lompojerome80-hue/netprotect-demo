<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetProtect — ouverture du site</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="NetProtect">
<meta property="og:description" content="Protection parentale et filtrage des contenus sensibles pour telephones Android.">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/lompojerome80-hue/netprotect-demo@main/affiche-qr.jpg">
<meta property="og:url" content="https://lompojerome80-hue.github.io/netprotect-demo/">
<link rel="icon" href="affiche-qr.jpg">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#070a16;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  a.hit{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;text-decoration:none;color:inherit}
  .shot{max-width:min(760px,94vw);max-height:94vh;border-radius:18px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.14);
    animation:pop .5s ease both}
  .shot img{display:block;width:100%;height:auto}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px;text-align:center;
    background:linear-gradient(180deg,rgba(7,10,22,0),rgba(7,10,22,.92));font-size:14px}
  .bar b{color:#4d8cff}
  .bar a{display:inline-block;margin-top:8px;padding:11px 20px;border-radius:12px;font-weight:700;
    color:#fff;text-decoration:none;background:linear-gradient(135deg,#3f7bff,#6d4dff)}
  #go{margin-top:8px;padding:11px 20px;border:0;border-radius:12px;font:inherit;font-weight:700;
    color:#fff;cursor:pointer;background:linear-gradient(135deg,#3f7bff,#6d4dff)}
</style>
</head>
<body>
  <a class="hit" href="https://lompojerome80-hue.github.io/netprotect-demo/" id="lien">
    <figure class="shot">
      <img src="https://cdn.jsdelivr.net/gh/lompojerome80-hue/netprotect-demo@main/affiche-qr.jpg"
           alt="NetProtect — cliquez pour ouvrir le site" width="1254" height="1254">
    </figure>
  </a>
  <div class="bar">
    Cliquez sur la photo pour ouvrir le site — <b>lompojerome80-hue.github.io/netprotect-demo</b>
    <br><a href="https://lompojerome80-hue.github.io/netprotect-demo/">Ouvrir NetProtect maintenant</a>
  </div>
<script>
  var cible = "https://lompojerome80-hue.github.io/netprotect-demo/";
  var Clicked = false;
  document.getElementById("lien").addEventListener("click", function (e) {
    e.preventDefault();
    Clicked = true;
    location.replace(cible);
  });
  setTimeout(function () { if (!Clicked) location.replace(cible); }, 4500);
</script>
</body>
</html>
